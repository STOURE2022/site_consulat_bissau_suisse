<!DOCTYPE html>
<!--
  ============================================================================
  CONSULAT HONORAIRE DE LA RÉPUBLIQUE DE GUINÉE-BISSAU EN SUISSE
  Site vitrine officiel — fichier HTML autonome (fonctionne par double-clic).

  ÉTAPE 1 : design system, sprite d'icônes SVG, dictionnaire de contenu « D »,
            en-tête, pied de page, routeur par hash, page ACCUEIL (français).

  PRINCIPE FONDAMENTAL POUR LE CLIENT
  -----------------------------------
  Tout le texte visible du site est stocké dans l'objet JavaScript « D », plus
  bas dans ce fichier, avec une entrée par langue (D.fr, D.pt, D.en). Pour
  corriger un texte, on modifie « D » : on ne touche jamais au HTML ni aux
  fonctions de rendu. Chaque page est décrite par un tableau « blocks » ; un
  moteur de rendu interprète le champ « type » de chaque bloc.

  Marqueur « [À VALIDER PAR LE CONSULAT : ... ] » : toute information non encore
  vérifiée officiellement est signalée ainsi et mise en évidence à l'écran. Un
  site diplomatique ne publie aucune donnée non validée.
  ============================================================================
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04452A">
<!-- Le titre et la description sont réécrits par le routeur à chaque page. -->
<title>Consulat honoraire de Guinée-Bissau en Suisse</title>
<meta name="description" content="Consulat honoraire de la République de Guinée-Bissau en Suisse : informer, orienter et assister les ressortissants. Ce consulat ne délivre ni passeport, ni visa, ni acte officiel.">

<!--
  RÉFÉRENCEMENT (SEO)
  ------------------------------------------------------------------------
  IMPORTANT : remplacer partout l'URL de base ci-dessous par le domaine
  officiel une fois connu. Les balises hreflang déclarent les trois versions
  linguistiques (paramètre ?lang=). Le routeur met à jour dynamiquement le
  lien canonique et les balises Open Graph à chaque changement de page/langue.
-->
<link rel="canonical" id="lienCanonique" href="https://www.consulat-guineebissau.ch/">
<link rel="alternate" hreflang="fr" href="https://www.consulat-guineebissau.ch/?lang=fr">
<link rel="alternate" hreflang="pt" href="https://www.consulat-guineebissau.ch/?lang=pt">
<link rel="alternate" hreflang="en" href="https://www.consulat-guineebissau.ch/?lang=en">
<link rel="alternate" hreflang="x-default" href="https://www.consulat-guineebissau.ch/">

<!-- Open Graph (partage sur les réseaux et messageries). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Consulat honoraire de Guinée-Bissau en Suisse">
<meta property="og:title" id="ogTitre" content="Consulat honoraire de Guinée-Bissau en Suisse">
<meta property="og:description" id="ogDesc" content="Informer, orienter et assister les ressortissants. Ce consulat ne délivre ni passeport, ni visa, ni acte officiel.">
<meta property="og:locale" id="ogLocale" content="fr_CH">
<meta property="og:url" id="ogUrl" content="https://www.consulat-guineebissau.ch/">
<!-- EMPLACEMENT IMAGE DE PARTAGE : déposer une image officielle 1200×630 px
     nommée « partage.jpg » à la racine, puis décommenter la ligne suivante.
<meta property="og:image" content="https://www.consulat-guineebissau.ch/partage.jpg"> -->

<!--
  DONNÉES STRUCTURÉES JSON-LD — type GovernmentOrganization.
  Compléter les champs [À VALIDER] une fois les informations officielles connues.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "GovernmentOrganization",
  "name": "Consulat honoraire de la République de Guinée-Bissau en Suisse",
  "alternateName": "Consulado honorário da Guiné-Bissau na Suíça",
  "url": "https://www.consulat-guineebissau.ch/",
  "areaServed": "CH",
  "knowsLanguage": ["fr", "pt", "en"],
  "parentOrganization": {
    "@type": "GovernmentOrganization",
    "name": "Ambassade de la République de Guinée-Bissau compétente pour la Suisse [À VALIDER PAR LE CONSULAT : nom et ville de l’Ambassade]"
  },
  "address": {
    "@type": "PostalAddress",
    "addressCountry": "CH",
    "addressLocality": "[À VALIDER : ville]",
    "streetAddress": "[À VALIDER : adresse complète du bureau consulaire]"
  },
  "telephone": "[À VALIDER : +41 …]",
  "email": "[À VALIDER : contact@…]"
}
</script>

<style>
/* ==========================================================================
   1. POLICES AUTO-HÉBERGÉES
   --------------------------------------------------------------------------
   Aucune police n'est chargée depuis un serveur tiers (pas de Google Fonts) :
   transmettre l'adresse IP du visiteur à un tiers est un point de non-
   conformité en droit suisse (nLPD) et européen (RGPD). On déclare des
   @font-face pointant vers un dossier local « fonts/ » à fournir. Tant que
   les fichiers ne sont pas présents, le repli système s'applique aussitôt,
   sans requête réseau et sans erreur bloquante.

   À FAIRE PAR LE CLIENT : déposer les fichiers .woff2 dans un dossier
   « fonts/ » à côté de ce fichier (voir README à l'étape 5).
   ========================================================================== */
@font-face{
  font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;
  src:local('Montserrat SemiBold'), url('fonts/montserrat-600.woff2') format('woff2');
}
@font-face{
  font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;
  src:local('Montserrat Bold'), url('fonts/montserrat-700.woff2') format('woff2');
}
@font-face{
  font-family:'Lato';font-style:normal;font-weight:400;font-display:swap;
  src:local('Lato Regular'), url('fonts/lato-400.woff2') format('woff2');
}
@font-face{
  font-family:'Lato';font-style:normal;font-weight:700;font-display:swap;
  src:local('Lato Bold'), url('fonts/lato-700.woff2') format('woff2');
}

/* ==========================================================================
   2. DESIGN SYSTEM — variables, réinitialisation, typographie
   ========================================================================== */
:root{
  /* Palette dérivée du drapeau national, registre institutionnel : le vert
     domine, le rouge et le jaune ne servent que d'accents. */
  --rouge:#CE1126; --jaune:#FCD116; --vert:#009E49;
  --vert-fonce:#04452A; --vert-nuit:#032B1B;
  --encre:#16201A; --gris:#5B6960; --ligne:#E3E7E3; --fond:#F7F9F7; --blanc:#fff;
  --alerte-fond:#FFF7E6; --alerte-bord:#E7B008;
  --oui-fond:#EAF6EF; --non-fond:#FBECEE;
  --titre:'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --texte:'Lato', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gut:clamp(18px, 4vw, 44px);
  --max:1180px;
  --r:3px; /* rayon d'angle maximal : on reste quasiment à angle droit */
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden} /* contient le menu coulissant hors écran */
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;background:var(--fond);color:var(--encre);
  font-family:var(--texte);font-size:clamp(16px,1.05vw,17px);line-height:1.65;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden; /* garde-fou : le menu coulissant hors écran ne crée pas de défilement latéral */
}
h1,h2,h3,h4{font-family:var(--titre);line-height:1.2;color:var(--vert-nuit);margin:0 0 .4em}
h1{font-size:clamp(1.7rem,3.6vw,2.6rem);font-weight:700}
h2{font-size:clamp(1.4rem,2.6vw,2rem);font-weight:700}
h3{font-size:clamp(1.15rem,1.8vw,1.35rem);font-weight:600}
p{margin:0 0 1em}
a{color:var(--vert-fonce);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{color:var(--rouge)}
img{max-width:100%;height:auto;display:block}
ul{margin:0 0 1em;padding-left:1.2em}
li{margin:.25em 0}

/* Filet tricolore national — signature répétée sous l'en-tête et les titres. */
.tricolore{height:4px;border:0;margin:0;
  background:linear-gradient(90deg,var(--rouge) 0 33.33%,var(--jaune) 0 66.66%,var(--vert) 0 100%);}
.tricolore--court{width:64px;height:3px;margin:.2em 0 1em}

/* Largeur de contenu limitée et centrée. */
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}

/* Lien d'évitement (accessibilité clavier). */
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--vert-nuit);
  color:#fff;padding:.7em 1.1em;border-radius:0 0 var(--r) 0}
.skip:focus{left:0}

/* Focus visible homogène sur tout élément interactif. */
:focus-visible{outline:3px solid var(--jaune);outline-offset:2px;border-radius:2px}

/* Marqueur d'information à valider — volontairement bien visible à l'écran. */
.avalider{display:inline;background:var(--jaune);color:#3a2c00;font-weight:700;
  padding:.05em .4em;border-radius:2px;text-decoration:underline dotted}

/* Emplacement réservé à une image (aucune photo n'est générée). */
.imgslot{background:
    repeating-linear-gradient(45deg,#eef2ee 0 12px,#e7ede7 0 24px),#eef2ee;
  border:1px dashed #b9c4bc;border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;text-align:center;
  color:#5f6d63;font-family:var(--titre);font-size:.85rem;padding:1.5em;min-height:180px}
.imgslot small{display:block;color:#7c8a80;font-weight:400;margin-top:.3em}

/* ==========================================================================
   3. EN-TÊTE / NAVIGATION
   ========================================================================== */
.bandeau-etat{background:var(--vert-nuit);color:#dfe8e2;font-size:.8rem}
.bandeau-etat .wrap{display:flex;gap:.5em 1.2em;flex-wrap:wrap;align-items:center;
  justify-content:space-between;padding-top:.4em;padding-bottom:.4em}
.bandeau-etat strong{color:#fff;font-weight:700}
.etat-droite{display:flex;align-items:center;gap:.6em 1.1em;flex-wrap:wrap}
/* Permanence téléphonique */
.permanence-tel{display:inline-flex;align-items:center;gap:.4em;color:#dfe8e2;text-decoration:none}
.permanence-tel:hover{color:#fff}
.permanence-tel .ic{color:var(--jaune)}
.permanence-tel strong{color:#fff}
/* Sélecteur de langue dans la barre sombre */
.bandeau-etat .langue>button{background:transparent;border-color:rgba(255,255,255,.28);
  color:#dfe8e2;padding:.3em .55em;font-size:.8rem}
.bandeau-etat .langue>button:hover{color:#fff;border-color:rgba(255,255,255,.6)}

header.site{position:sticky;top:0;z-index:100;background:var(--blanc);
  box-shadow:0 1px 0 var(--ligne)}
.entete{display:flex;align-items:center;gap:1em;padding:.7em 0}
.marque{display:flex;align-items:center;gap:.8em;text-decoration:none;color:inherit;margin-right:auto}
.embleme{width:48px;height:48px;object-fit:contain;flex:0 0 auto}
.armoiries{flex:0 0 auto;width:52px;height:52px;border:1px solid var(--ligne);
  border-radius:var(--r);display:flex;align-items:center;justify-content:center;
  background:var(--fond);color:var(--vert-fonce)}
.marque{max-width:340px}
.marque .lignes strong{display:block;font-family:var(--titre);font-weight:700;
  font-size:.95rem;line-height:1.15;color:var(--vert-nuit)}
.marque .lignes span{display:block;font-size:.76rem;color:var(--gris)}

/* Navigation principale (bureau). */
.nav-principale{display:flex;gap:.1em}
.nav-principale a{font-family:var(--titre);font-weight:600;font-size:.88rem;
  white-space:nowrap; /* jamais de libellé coupé sur deux lignes */
  color:var(--encre);text-decoration:none;padding:.5em .55em;border-radius:var(--r);
  border-bottom:3px solid transparent}
.nav-principale a:hover{background:var(--fond);color:var(--vert-fonce)}
.nav-principale a[aria-current="page"]{color:var(--vert-fonce);border-bottom-color:var(--vert)}

/* En-tête légèrement élargi : laisse respirer la navigation (8 entrées) et
   réduit les marges latérales vides sur grand écran. */
header.site .wrap, .bandeau-etat .wrap{max-width:min(95vw, 1300px)}

/* Entrée d'action « Rendez-vous », mise en avant comme un bouton. */
.nav-principale a.nav-cta{background:var(--vert);color:#fff;border-bottom-color:transparent}
.nav-principale a.nav-cta:hover{background:#00833d;color:#fff}
.nav-principale a.nav-cta[aria-current="page"]{background:var(--vert-fonce);color:#fff;border-bottom-color:transparent}

/* Sélecteur de langue. */
.langue{position:relative}
.langue>button{font-family:var(--titre);font-weight:600;font-size:.85rem;
  background:var(--fond);border:1px solid var(--ligne);border-radius:var(--r);
  padding:.5em .7em;cursor:pointer;display:flex;align-items:center;gap:.35em;color:var(--encre)}
.langue ul{position:absolute;right:0;top:calc(100% + 6px);margin:0;padding:.3em;
  list-style:none;background:#fff;border:1px solid var(--ligne);border-radius:var(--r);
  box-shadow:0 6px 20px rgba(0,0,0,.1);min-width:150px;z-index:120}
.langue ul[hidden]{display:none}
.langue li{margin:0}
.langue li button{width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:.5em .6em;border-radius:2px;font:inherit;color:var(--encre)}
.langue li button:hover{background:var(--fond)}
.langue li button[aria-current="true"]{font-weight:700;color:var(--vert-fonce)}

/* Bouton burger (mobile). */
.burger{display:none;background:var(--fond);border:1px solid var(--ligne);
  border-radius:var(--r);padding:.5em;cursor:pointer;color:var(--vert-nuit)}

/* Bouton « fermer » du menu mobile (masqué en navigation bureau). */
.nav-fermer{display:none;background:var(--fond);border:1px solid var(--ligne);
  border-radius:var(--r);padding:.4em;cursor:pointer;color:var(--vert-nuit)}

/* Icônes via sprite. */
.ic{width:1.15em;height:1.15em;fill:currentColor;flex:0 0 auto;vertical-align:-.15em}
.ic--lg{width:1.7em;height:1.7em}

/* Bandeau d'information temporaire (piloté par l'admin). */
.bandeau-info{font-size:.92rem}
.bandeau-info[hidden]{display:none}
.bandeau-info .wrap{display:flex;gap:.6em;align-items:flex-start;padding-top:.75em;padding-bottom:.75em}
.bandeau-info .ic{flex:0 0 auto;margin-top:.1em}
.bandeau-info p{margin:0}
.bandeau-info--info{background:#eef3ef;border-bottom:1px solid var(--vert);color:var(--vert-nuit)}
.bandeau-info--info .ic{color:var(--vert-fonce)}
.bandeau-info--attention{background:var(--alerte-fond);border-bottom:1px solid var(--alerte-bord);color:#5a4406}
.bandeau-info--attention .ic{color:#a5730a}

/* ==========================================================================
   4. BANDEAU D'ALERTE PERMANENT (compétences) — visible en haut de chaque page
   ========================================================================== */
.alerte-competence{background:var(--alerte-fond);border-bottom:1px solid var(--alerte-bord)}
.alerte-competence .wrap{display:flex;gap:.7em;align-items:flex-start;
  padding-top:.7em;padding-bottom:.7em}
.alerte-competence .ic{color:#a5730a;margin-top:.15em}
.alerte-competence p{margin:0;font-size:.92rem;color:#5a4406}
.alerte-competence strong{color:#3a2c00}

/* ==========================================================================
   5. SECTIONS & BLOCS
   ========================================================================== */
main{display:block}
.section{padding:clamp(28px,5vw,60px) 0}
.section--sombre{background:var(--vert-nuit);color:#e7efe9}
.section--sombre h2,.section--sombre h3{color:#fff}
.section--teinte{background:#eef3ef}
.section__intro{max-width:70ch}

/* HERO */
.hero{background:var(--vert-nuit);color:#eaf1ec;overflow:hidden}
.hero .grille{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(20px,4vw,48px);
  align-items:center;padding:clamp(34px,6vw,72px) 0}
.hero h1{color:#fff}
.hero .lead{font-size:clamp(1.02rem,1.5vw,1.2rem);color:#cfe0d5;max-width:52ch}
.hero .actions{display:flex;flex-wrap:wrap;gap:.7em;margin-top:1.3em}
.hero .imgslot{min-height:300px;background:
    repeating-linear-gradient(45deg,#0a3a25 0 12px,#0c3f28 0 24px);
  border-color:#1c5a3d;color:#a9c9b7}
.hero .imgslot small{color:#8fb6a1}
.hero .hero-photo{border-radius:var(--r);overflow:hidden;align-self:stretch}
.hero .hero-img{width:100%;height:100%;min-height:300px;object-fit:cover;display:block}
@media (max-width:560px){.hero .hero-img{min-height:200px}}

/* Boutons */
.btn{display:inline-flex;align-items:center;gap:.5em;font-family:var(--titre);
  font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;
  padding:.7em 1.15em;border-radius:var(--r);border:1px solid transparent}
.btn--primaire{background:var(--vert);color:#fff}
.btn--primaire:hover{background:#00833d;color:#fff}
.btn--clair{background:#fff;color:var(--vert-nuit);border-color:#fff}
.btn--clair:hover{background:#eef3ef;color:var(--vert-nuit)}
.btn--ligne{background:transparent;color:inherit;border-color:currentColor}

/* Grille de cartes (blocs « cards » et accès rapides) */
.cartes{display:grid;gap:clamp(14px,2vw,22px)}
.cartes--2{grid-template-columns:repeat(2,1fr)}
.cartes--3{grid-template-columns:repeat(3,1fr)}
.cartes--4{grid-template-columns:repeat(4,1fr)}
.carte{background:#fff;border:1px solid var(--ligne);border-radius:var(--r);
  padding:clamp(16px,2vw,22px);display:flex;flex-direction:column;gap:.5em}
a.carte{text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
a.carte:hover{border-color:var(--vert);transform:translateY(-2px)}
.carte .ic{color:var(--vert-fonce)}
.carte h3{margin:0}
.carte p{margin:0;font-size:.92rem;color:var(--gris)}
.carte .fleche{margin-top:auto;font-family:var(--titre);font-weight:600;
  font-size:.85rem;color:var(--vert-fonce);display:inline-flex;align-items:center;gap:.3em}

/* Bloc comparatif « can » : ce que nous faisons / ne faisons pas */
.can{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,22px)}
.can__col{border:1px solid var(--ligne);border-radius:var(--r);padding:clamp(16px,2.2vw,24px);background:#fff}
.can__col--oui{background:var(--oui-fond);border-color:#bfe3cd}
.can__col--non{background:var(--non-fond);border-color:#f0c9cf}
.can__col h3{display:flex;align-items:center;gap:.5em}
.can__col--oui h3{color:#04672f}
.can__col--non h3{color:#a01523}
.can__col ul{list-style:none;padding:0;margin:.6em 0 0}
.can__col li{display:flex;gap:.55em;align-items:flex-start;margin:.55em 0;font-size:.95rem}
.can__col li .ic{margin-top:.15em}
.can__col--oui li .ic{color:#04672f}
.can__col--non li .ic{color:#a01523}

/* Bloc « note » (encadré d'information) */
.note{border:1px solid var(--ligne);border-left:4px solid var(--vert);
  background:#fff;border-radius:var(--r);padding:clamp(14px,2vw,20px);display:flex;gap:.8em}
.note--info{border-left-color:var(--vert)}
.note--attention{border-left-color:var(--alerte-bord);background:var(--alerte-fond)}
.note .ic{flex:0 0 auto;margin-top:.15em;color:var(--vert-fonce)}
.note--attention .ic{color:#a5730a}
.note p:last-child{margin-bottom:0}

/* Mot du Consul */
.mot-consul{display:grid;grid-template-columns:220px 1fr;gap:clamp(18px,3vw,36px);align-items:start}
.mot-consul .portrait{aspect-ratio:3/4}
.mot-consul .portrait-img{width:100%;height:100%;object-fit:cover;border-radius:var(--r);border:1px solid var(--ligne)}
.mot-consul blockquote{margin:0;font-size:1.08rem;line-height:1.7}
.mot-consul .signature{font-family:var(--titre);font-weight:700;color:var(--vert-nuit);margin-top:.8em}
.mot-consul .signature span{display:block;font-weight:400;font-size:.9rem;color:var(--gris)}

/* Liste d'actualités */
.actus{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,22px)}
.actu{background:#fff;border:1px solid var(--ligne);border-radius:var(--r);
  padding:clamp(14px,2vw,20px);display:flex;flex-direction:column;gap:.5em}
.actu .meta{display:flex;gap:.6em;align-items:center;font-size:.78rem;color:var(--gris)}
.etiquette{font-family:var(--titre);font-weight:600;font-size:.72rem;text-transform:uppercase;
  letter-spacing:.03em;color:var(--vert-fonce);background:var(--oui-fond);
  border:1px solid #cfe6d8;border-radius:2px;padding:.15em .5em}
.actu h3{margin:.1em 0 0;font-size:1.05rem}
.actu p{margin:0;font-size:.92rem;color:var(--gris)}

/* En-tête de section avec filet court */
.section__titre{margin-bottom:.2em}

/* --- Bloc « rich » : titre + paragraphes + liste, portrait optionnel --- */
.rich{max-width:74ch}
.rich .lead{font-size:1.1rem;color:var(--vert-fonce)}
.rich ul.puces{list-style:none;padding:0}
.rich ul.puces li{display:flex;gap:.6em;align-items:flex-start;margin:.5em 0}
.rich ul.puces li .ic{color:var(--vert);margin-top:.2em;flex:0 0 auto}
.rich--media{display:grid;grid-template-columns:1fr 260px;gap:clamp(20px,3vw,40px);
  align-items:start;max-width:none}
.rich--media .portrait{aspect-ratio:3/4}
.rich--media .portrait-img{width:100%;height:100%;object-fit:cover;border-radius:var(--r);border:1px solid var(--ligne)}

/* --- Bloc « accordion » (FAQ dépliable, accessible clavier) --- */
.accordion{border:1px solid var(--ligne);border-radius:var(--r);background:#fff;overflow:hidden}
.accordion__item + .accordion__item{border-top:1px solid var(--ligne)}
.accordion__tete{width:100%;text-align:left;background:none;border:0;cursor:pointer;
  font-family:var(--titre);font-weight:600;font-size:1.02rem;color:var(--vert-nuit);
  padding:1em clamp(14px,2vw,20px);display:flex;align-items:center;gap:.7em}
.accordion__tete:hover{background:var(--fond)}
.accordion__tete .ic{flex:0 0 auto;color:var(--vert-fonce);margin-left:auto;transition:transform .2s}
.accordion__tete[aria-expanded="true"] .ic{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.accordion__tete .ic{transition:none}}
.accordion__corps{padding:0 clamp(14px,2vw,20px)}
.accordion__corps[hidden]{display:none}
.accordion__corps>div{padding:0 0 1.1em}
.accordion__corps p:last-child{margin-bottom:0}

/* --- Bloc « facts » : repères clé / valeur (chiffres du pays) --- */
.facts{list-style:none;padding:0;margin:0;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;
  background:var(--ligne);border:1px solid var(--ligne);border-radius:var(--r);overflow:hidden}
.facts>div{background:#fff;padding:clamp(14px,2vw,18px)}
.facts dt{font-size:.8rem;color:var(--gris);text-transform:uppercase;letter-spacing:.03em;
  font-family:var(--titre);font-weight:600;margin:0 0 .2em}
.facts dd{margin:0;font-family:var(--titre);font-weight:700;font-size:1.25rem;color:var(--vert-nuit)}

/* --- Bloc « downloads » : documents PDF --- */
.downloads{list-style:none;padding:0;margin:0;display:grid;gap:.7em}
.telechargement{display:flex;gap:.9em;align-items:center;background:#fff;
  border:1px solid var(--ligne);border-radius:var(--r);padding:.9em 1em;text-decoration:none;color:inherit}
a.telechargement:hover{border-color:var(--vert)}
.telechargement .ic{color:var(--vert-fonce)}
.telechargement .infos{flex:1 1 auto}
.telechargement strong{display:block;font-family:var(--titre);color:var(--vert-nuit)}
.telechargement small{color:var(--gris)}
.telechargement .format{font-family:var(--titre);font-weight:600;font-size:.72rem;
  color:var(--vert-fonce);border:1px solid #cfe6d8;border-radius:2px;padding:.15em .5em}
.telechargement[aria-disabled="true"]{opacity:.75;cursor:default;background:var(--fond)}

/* --- Bloc « steps » : procédure numérotée --- */
.steps{list-style:none;counter-reset:etape;padding:0;margin:0;display:grid;gap:.9em}
.steps li{counter-increment:etape;display:flex;gap:1em;align-items:flex-start;
  background:#fff;border:1px solid var(--ligne);border-radius:var(--r);padding:clamp(14px,2vw,18px)}
.steps li::before{content:counter(etape);flex:0 0 auto;width:2em;height:2em;
  display:flex;align-items:center;justify-content:center;background:var(--vert);color:#fff;
  font-family:var(--titre);font-weight:700;border-radius:50%}
.steps li h3{margin:0 0 .2em;font-size:1.05rem}
.steps li p{margin:0;font-size:.95rem;color:var(--gris)}

/* --- Bloc « contactcard » : coordonnées + horaires + accès --- */
.contactcard{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,2vw,22px)}
.contactcard .fiche{background:#fff;border:1px solid var(--ligne);border-radius:var(--r);
  padding:clamp(16px,2.2vw,24px)}
.contactcard .fiche h3{display:flex;align-items:center;gap:.5em}
.contactcard .fiche .ic{color:var(--vert-fonce)}
.contactcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.4em 1em}
.contactcard dt{font-weight:700;color:var(--vert-nuit)}
.contactcard dd{margin:0}
@media (max-width:640px){.contactcard{grid-template-columns:1fr}
  .rich--media{grid-template-columns:1fr}.rich--media .portrait{max-width:220px}}

/* --- Filtres d'actualités (par rubrique) --- */
.filtres{display:flex;flex-wrap:wrap;gap:.5em;margin:0 0 1.4em}
.filtres button{font-family:var(--titre);font-weight:600;font-size:.85rem;cursor:pointer;
  background:#fff;border:1px solid var(--ligne);border-radius:var(--r);padding:.5em .9em;color:var(--encre)}
.filtres button:hover{border-color:var(--vert)}
.filtres button[aria-pressed="true"]{background:var(--vert-fonce);border-color:var(--vert-fonce);color:#fff}
.actu--une{border-left:4px solid var(--rouge)}
.actu .aune{font-family:var(--titre);font-weight:700;font-size:.72rem;text-transform:uppercase;
  letter-spacing:.03em;color:var(--rouge)}
.actus-vide{color:var(--gris);padding:1.4em;border:1px dashed var(--ligne);border-radius:var(--r);text-align:center}

/* Pièces jointes des actualités (photos en galerie, PDF en liens). */
.actu .galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.5em;margin:.6em 0 0}
.actu .galerie-lien{display:block;border-radius:2px;overflow:hidden;border:1px solid var(--ligne);cursor:zoom-in}
.actu .galerie-lien img{width:100%;height:96px;object-fit:cover;display:block;transition:transform .2s ease}
.actu .galerie-lien:hover img{transform:scale(1.05)}
@media (prefers-reduced-motion:reduce){.actu .galerie-lien img{transition:none}}
.actu .docs{display:flex;flex-wrap:wrap;gap:.5em;margin:.6em 0 0}
.actu .doc{display:inline-flex;align-items:center;gap:.4em;font-family:var(--titre);font-weight:600;
  font-size:.8rem;text-decoration:none;color:var(--vert-fonce);border:1px solid var(--ligne);
  border-radius:var(--r);padding:.35em .55em}
.actu .doc:hover{border-color:var(--vert)}

/* --- Emplacement de carte (aucune carte tierce : respect de la vie privée) --- */
.map{min-height:320px;background:
    repeating-linear-gradient(45deg,#eef2ee 0 16px,#e6ede6 0 32px),#eef2ee;
  border:1px dashed #b9c4bc;border-radius:var(--r);display:flex;align-items:center;
  justify-content:center;text-align:center;color:#5f6d63;font-family:var(--titre);padding:1.5em}
.map small{display:block;color:#7c8a80;font-weight:400;margin-top:.3em}

/* --- Formulaire de contact --- */
.form{max-width:720px;background:#fff;border:1px solid var(--ligne);border-radius:var(--r);
  padding:clamp(18px,3vw,30px)}
.form .champ{margin:0 0 1.1em}
.form label{display:block;font-family:var(--titre);font-weight:600;margin:0 0 .35em;color:var(--vert-nuit)}
.form label .requis{color:var(--rouge)}
.form input,.form select,.form textarea{width:100%;font:inherit;color:var(--encre);
  background:var(--fond);border:1px solid var(--ligne);border-radius:var(--r);padding:.7em .8em}
.form input:focus,.form select:focus,.form textarea:focus{background:#fff;border-color:var(--vert)}
.form textarea{min-height:140px;resize:vertical}
.form .aide{font-size:.82rem;color:var(--gris);margin:.3em 0 0}
.form .pot{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.form .consentement{display:flex;gap:.6em;align-items:flex-start}
.form .consentement input{width:auto;margin-top:.3em}
.form button[type="submit"]{margin-top:.4em}
.form button[disabled]{opacity:.6;cursor:not-allowed}
.form__confirmation{background:var(--oui-fond);border:1px solid #bfe3cd;border-left:4px solid var(--vert);
  border-radius:var(--r);padding:1em 1.2em;display:flex;gap:.7em;align-items:flex-start}
.form__confirmation .ic{color:#04672f;flex:0 0 auto;margin-top:.15em}

/* --- Bandeau cookies (refus aussi simple que l'acceptation) --- */
.cookies-banniere{position:fixed;left:0;right:0;bottom:0;z-index:150;background:#fff;
  border-top:3px solid var(--vert-fonce);box-shadow:0 -6px 24px rgba(0,0,0,.12)}
.cookies-banniere[hidden]{display:none}
.cookies-banniere .wrap{display:flex;flex-wrap:wrap;gap:1em;align-items:center;
  justify-content:space-between;padding:1em 0}
.cookies-banniere p{margin:0;font-size:.9rem;max-width:64ch}
.cookies-banniere .boutons{display:flex;gap:.6em;flex-wrap:wrap}

/* --- Bloc « rdv » : demande de rendez-vous --- */
.bloc-rdv{display:grid;grid-template-columns:1.6fr 1fr;gap:clamp(18px,3vw,34px);align-items:start}
.rdv-form{background:#fff;border:1px solid var(--ligne);border-radius:var(--r);padding:clamp(18px,2.5vw,26px)}
.rdv-form .champ{margin:0 0 1.2em}
.rdv-form label.etq{display:block;font-family:var(--titre);font-weight:600;margin:0 0 .35em;color:var(--vert-nuit)}
.rdv-form .req{color:var(--rouge)}
.rdv-form input,.rdv-form select,.rdv-form textarea{width:100%;font:inherit;color:var(--encre);
  background:var(--fond);border:1px solid var(--ligne);border-radius:var(--r);padding:.7em .8em}
.rdv-form input:focus,.rdv-form select:focus,.rdv-form textarea:focus{background:#fff;border-color:var(--vert);outline:none}
.rdv-form textarea{min-height:110px;resize:vertical}
.rdv-form .aide{font-size:.82rem;color:var(--gris);margin:.3em 0 0}
.rdv-form .pot{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.rdv-form .consent{display:flex;gap:.6em;align-items:flex-start}
.rdv-form .consent input{width:auto;margin-top:.3em}
.legende-champ{display:flex;align-items:baseline;justify-content:space-between;gap:1em;flex-wrap:wrap}
.legende-champ .indic{font-size:.78rem;color:var(--gris)}
.puces{display:flex;flex-wrap:wrap;gap:.5em;margin:.2em 0 0}
.puce{font-family:var(--titre);font-weight:600;font-size:.9rem;cursor:pointer;background:#fff;
  border:1px solid var(--ligne);border-radius:var(--r);padding:.55em .8em;color:var(--encre);
  text-align:center;line-height:1.2}
.puce small{display:block;font-weight:400;font-size:.72rem;color:var(--gris)}
.puce:hover{border-color:var(--vert)}
.puce[aria-pressed="true"]{background:var(--vert-fonce);border-color:var(--vert-fonce);color:#fff}
.puce[aria-pressed="true"] small{color:#bfe3cd}
.creneaux[hidden]{display:none}
.rdv-recap{background:var(--oui-fond);border:1px solid #bfe3cd;border-radius:var(--r);
  padding:.7em .9em;font-size:.9rem;margin:0 0 1.2em}
.rdv-recap[hidden]{display:none}
.rdv-confirmation{background:var(--oui-fond);border:1px solid #bfe3cd;border-left:4px solid var(--vert);
  border-radius:var(--r);padding:1em 1.2em;display:flex;gap:.7em;align-items:flex-start;margin-top:1em}
.rdv-confirmation[hidden]{display:none}
.rdv-confirmation .ic{color:#04672f;flex:0 0 auto;margin-top:.15em}
.rdv-aside .carte-rdv{background:#fff;border:1px solid var(--ligne);border-radius:var(--r);
  padding:clamp(16px,2vw,22px);margin-bottom:16px}
.rdv-aside h3{display:flex;align-items:center;gap:.5em;margin:0 0 .3em}
.rdv-aside h3 .ic{color:var(--vert-fonce)}
.rdv-aside dl{margin:0 0 1em;display:grid;grid-template-columns:auto 1fr;gap:.35em .8em;font-size:.92rem}
.rdv-aside dt{font-weight:700;color:var(--vert-nuit)}
.rdv-aside dd{margin:0}
.rdv-attention{background:var(--alerte-fond);border:1px solid #f0d69a;border-left:4px solid var(--alerte-bord);
  border-radius:var(--r);padding:.9em 1em;font-size:.9rem;color:#5a4406}
.rdv-attention strong{color:#3a2c00}
@media (max-width:820px){.bloc-rdv{grid-template-columns:1fr}}

/* États d'erreur d'envoi (formulaires contact et rendez-vous). */
.form__erreur,.rdv-erreur{background:var(--non-fond);border-color:#f0c9cf;border-left-color:var(--rouge)}
.form__erreur .ic,.rdv-erreur .ic{color:var(--rouge)}

/* ==========================================================================
   6. PIED DE PAGE
   ========================================================================== */
footer.site{background:var(--vert-nuit);color:#c8d6cd;font-size:.9rem}
footer.site .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:clamp(20px,3vw,40px);
  padding:clamp(30px,5vw,52px) 0}
footer.site h4{color:#fff;font-size:.95rem;margin:0 0 .7em}
footer.site a{color:#c8d6cd;text-decoration:none}
footer.site a:hover{color:#fff;text-decoration:underline}
footer.site ul{list-style:none;padding:0;margin:0}
footer.site li{margin:.35em 0}
.pied-bas{border-top:1px solid #10412a}
.pied-bas .wrap{display:flex;flex-wrap:wrap;gap:.6em 1.4em;justify-content:space-between;
  padding:.9em 0;font-size:.82rem;color:#9db3a6}
.pied-bas nav{display:flex;flex-wrap:wrap;gap:.4em 1.1em}
.lien-admin{display:inline-flex;align-items:center;gap:.4em;font-family:var(--titre);font-weight:600;
  font-size:.8rem;color:#c8d6cd;text-decoration:none;border:1px solid #10412a;border-radius:var(--r);padding:.35em .7em}
.lien-admin:hover{color:#fff;border-color:var(--vert);text-decoration:none}
.lien-admin .ic{width:1em;height:1em}

/* ==========================================================================
   7. ANIMATIONS D'APPARITION (désactivées si prefers-reduced-motion)
   ========================================================================== */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.reveal.vu{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1 !important;transform:none !important;transition:none !important}
}

/* ==========================================================================
   8. RESPONSIVE — mobile d'abord ; ruptures à 1180 / 900 / 640
   ========================================================================== */
/* En dessous de 1180 px, la navigation horizontale n'a plus la place de tenir
   sur une ligne : on bascule vers le menu « burger » coulissant. */
@media (max-width:1180px){
  .cartes--4{grid-template-columns:repeat(2,1fr)}
  .burger{display:inline-flex}
  .nav-principale{position:fixed;inset:0 0 0 auto;width:min(84vw,340px);
    background:#fff;flex-direction:column;gap:0;padding:5em 1.2em 2em;
    box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(100%);
    transition:transform .25s ease;overflow:auto}
  .nav-principale.ouvert{transform:none}
  .nav-principale a{padding:.9em .6em;border-bottom:1px solid var(--ligne);border-radius:0;
    white-space:normal;font-size:1rem}
  .nav-principale a[aria-current="page"]{border-bottom-color:var(--ligne);color:var(--vert-fonce)}
  /* Bouton fermer visible en haut à droite du menu coulissant. */
  .nav-principale{padding-top:1em}
  .nav-fermer{display:inline-flex;align-items:center;justify-content:center;align-self:flex-end;margin-bottom:.4em}
  /* Dans le menu coulissant, l'action « Rendez-vous » reste un bloc mis en avant. */
  .nav-principale a.nav-cta{color:#fff;border-radius:var(--r);text-align:center;margin-top:.7em;border-bottom:0}
  .nav-principale a.nav-cta[aria-current="page"]{color:#fff}
}
@media (max-width:900px){
  .hero .grille{grid-template-columns:1fr}
  .mot-consul{grid-template-columns:1fr}
  .mot-consul .portrait{max-width:220px}
  .actus{grid-template-columns:1fr}
  .cartes--3{grid-template-columns:1fr 1fr}
  footer.site .cols{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){.nav-principale{transition:none}}
@media (max-width:640px){
  .cartes--2,.cartes--3,.cartes--4{grid-template-columns:1fr}
  .can{grid-template-columns:1fr}
  footer.site .cols{grid-template-columns:1fr}
  .bandeau-etat .wrap{justify-content:flex-start}
}
/* Très petits écrans : on allège l'en-tête pour laisser respirer l'intitulé. */
@media (max-width:560px){
  .entete{gap:.6em}
  .armoiries{width:42px;height:42px}
  .embleme{width:40px;height:40px}
  .marque{gap:.6em;max-width:none}
  .marque .lignes strong{font-size:.9rem}
  .langue>button{padding:.5em .55em;gap:.25em}
  .hero .imgslot{min-height:200px}
  .pied-bas .wrap{gap:.5em}
  .permanence-tel [data-ui="perm-label"]{display:none} /* on garde l'icône + le numéro */
}

/* Voile sombre derrière le menu mobile ouvert. */
.voile{position:fixed;inset:0;background:rgba(3,20,13,.45);z-index:90;border:0}
.voile[hidden]{display:none}
</style>

<!--

  GABARITS FIXES (en-tête, alerte, pied) — le contenu textuel est injecté
  par JavaScript à partir de « D » pour ne rien écrire en dur.

<header class="site">
  <!-- Bandeau d'État : intitulé + permanence téléphonique + sélecteur de langue. -->
  <div class="bandeau-etat">
    <div class="wrap">
      <span data-ui="etat-gauche"></span>
      <div class="etat-droite">
        <!-- Permanence téléphonique (numéro géré depuis l'admin). -->

/* ============================================================================
   ÉTAT DE L'APPLICATION
   Conservé uniquement en variables JavaScript : aucun localStorage ni
   sessionStorage (contrainte de confidentialité et de simplicité).
   ============================================================================ */
var Etat = {
  langue: "fr",          // langue active
  route: "accueil",      // page active
  cookiesFerme: false    // bandeau cookies masqué pour la session (non persistant)
};

/* Renvoie le dictionnaire de la langue active, en appliquant le repli éventuel
   (langue amorcée -> français) champ par champ, sans jamais planter. */
function dico(){
  var d = D[Etat.langue] || D.fr;
  if (d.__repli && D[d.__repli]) {
    // Fusion superficielle : ce qui est traduit prime, le reste retombe sur le repli.
    var base = D[d.__repli];
    return {
      code: d.code || base.code,
      ui:    Object.assign({}, base.ui, d.ui || {}),
      nav:   d.nav   || base.nav,
      news:  d.news  || base.news,
      pages: d.pages || base.pages
    };
  }
  return d;
}

/* Petite fabrique d'éléments : creer('div', {class:'x'}, [enfants|texte]). */
function creer(tag, attrs, enfants){
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs){
    if (k === "html") el.innerHTML = attrs[k];
    else if (k === "text") el.textContent = attrs[k];
    else el.setAttribute(k, attrs[k]);
  }
  if (enfants){
    if (!Array.isArray(enfants)) enfants = [enfants];
    for (var i=0;i<enfants.length;i++){
      var c = enfants[i];
      if (c == null) continue;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
  }
  return el;
}

/* Construit une icône du sprite : icone('ic-check'). */
function icone(id, classe){
  var svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","ic" + (classe ? " "+classe : ""));
  svg.setAttribute("aria-hidden","true");
  var use = document.createElementNS("http://www.w3.org/2000/svg","use");
  use.setAttribute("href","#"+id);
  svg.appendChild(use);
  return svg;
}

/* Transforme certains marqueurs [À VALIDER PAR LE CONSULAT : ...] présents dans
   un texte en éléments <mark> repérables. On échappe d'abord le HTML pour la
   sécurité, puis on stylise le marqueur. Renvoie une chaîne HTML sûre. */
function baliser(texte){
  /* On remplace d'abord les jetons {par:clé} par les coordonnées du consulat. */
  var s = injecter(texte)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  /* Liste blanche de balises de mise en forme réautorisées après échappement :
     seules <strong>, <em> et <br> sont rétablies ; tout autre HTML reste neutralisé. */
  s = s.replace(/&lt;(\/?)(strong|em)&gt;/g, "<$1$2>")
       .replace(/&lt;br\s*\/?&gt;/g, "<br>");
  /* Marqueurs « à valider » dans les trois langues (FR / PT / EN). */
  s = s.replace(/\[(À VALIDER|A VALIDAR|TO BE CONFIRMED)[^\]]*\]/g, function(m){
    return '<mark class="avalider">'+m+'</mark>';
  });
  return s;
}

/* Formate une date ISO (AAAA-MM-JJ) dans la langue active, sans dépendance externe. */
var MOIS = {
  fr: ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"],
  pt: ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"],
  en: ["January","February","March","April","May","June","July","August","September","October","November","December"]
};
function dateLisible(iso){
  var p = iso.split("-");
  if (p.length !== 3) return iso;
  var mois = (MOIS[Etat.langue] || MOIS.fr)[parseInt(p[1],10)-1];
  var jour = parseInt(p[2],10), an = p[0];
  /* En anglais : « 10 July 2026 » reste clair et sans dépendance de format. */
  return jour + " " + mois + " " + an;
}

/* ============================================================================
   COMMUNICATION AVEC LE BACKEND
   Les formulaires (contact, rendez-vous) envoient leurs données au serveur
   par une requête du MÊME domaine (aucun tiers). Si la page est ouverte en
   local (double-clic, protocole file:), on bascule en mode démonstration :
   confirmation affichée sans aucun appel réseau.
   ============================================================================ */
function modeDemo(){ return location.protocol === "file:"; }

function posterJSON(url, data){
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  }).then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

/* Charge (une seule fois) les publications enregistrées par le consulat via
   l'espace d'administration, et les convertit au format des actualités. Renvoie
   null en mode local ou en cas d'échec, pour retomber sur les actualités
   statiques du dictionnaire D. */
var PUBLICATIONS = null; // cache
function chargerPublications(){
  if (modeDemo()) return Promise.resolve(null);
  if (PUBLICATIONS) return Promise.resolve(PUBLICATIONS);
  return fetch("/api/publications")
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (j && j.ok && j.publications && j.publications.length){
        PUBLICATIONS = j.publications.map(function(p){
          return { cat: p.rubrique, r: p.une ? 1 : 0, d: p.date,
                   t: p.titre, x: p.resume || p.corps, fichiers: p.fichiers || [] };
        });
        return PUBLICATIONS;
      }
      return null; // aucune publication : on garde les actualités statiques
    })
    .catch(function(){ return null; });
}

/* Remplace les jetons {par:clé} par la valeur du paramètre ou son repli. */
function injecter(texte){
  return String(texte).replace(/\{par:([a-z_]+)\}/g, function(m, cle){
    var v = PARAMS[cle];
    if (v !== undefined && v !== null && String(v).length) return v;
    return DEFAUTS_PARAM[cle] || "[À VALIDER : " + cle + "]";
  });
}

/* Charge une fois les paramètres depuis le serveur (repli : objet vide). */
var PARAMS_CHARGES = false;
function chargerParametres(){
  if (modeDemo() || PARAMS_CHARGES) return Promise.resolve(PARAMS);
  return fetch("/api/parametres")
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (j && j.ok && j.parametres) PARAMS = j.parametres;
      PARAMS_CHARGES = true;
      return PARAMS;
    })
    .catch(function(){ return PARAMS; });
}

/* Affiche (ou masque) le bandeau d'information temporaire piloté par l'admin. */
function afficherBandeau(){
  var el = document.getElementById("bandeauInfo");
  if (!el) return;
  var actif = PARAMS.bandeau_actif === "1" || PARAMS.bandeau_actif === "true";
  var texte = PARAMS.bandeau_texte || "";
  if (!actif || !texte){ el.hidden = true; el.innerHTML = ""; return; }
  var type = PARAMS.bandeau_type === "attention" ? "attention" : "info";
  el.className = "bandeau-info bandeau-info--" + type;
  el.innerHTML = "";
  el.appendChild(creer("div",{class:"wrap"},[
    icone(type === "attention" ? "ic-alerte" : "ic-info","ic--lg"),
    creer("p",{html:baliser(texte)})
  ]));
  el.hidden = false;
}

/* Charge (une fois) les documents utiles gérés par le consulat. Renvoie null en
   mode local ou en cas d'échec (le bloc conserve alors ses éléments statiques). */
var DOCUMENTS = null;
function chargerDocuments(){
  if (modeDemo()) return Promise.resolve(null);
  if (DOCUMENTS) return Promise.resolve(DOCUMENTS);
  return fetch("/api/documents")
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (j && j.ok && j.documents && j.documents.length){ DOCUMENTS = j.documents; return DOCUMENTS; }
      return null;
    })
    .catch(function(){ return null; });
}

/* Ajoute à une carte d'actualité ses pièces jointes (galerie d'images + PDF). */
function ajouterPiecesJointes(article, n){
  if (!n.fichiers || !n.fichiers.length) return;
  var imgs = n.fichiers.filter(function(f){ return f.estImage; });
  var docs = n.fichiers.filter(function(f){ return !f.estImage; });
  if (imgs.length){
    var g = creer("div",{class:"galerie"});
    imgs.forEach(function(f){
      /* Photo cliquable : ouvre l'image en grand dans un nouvel onglet. */
      g.appendChild(creer("a",{class:"galerie-lien", href:"/api/fichier/"+f.id,
        target:"_blank", rel:"noopener", title:"Ouvrir l’image : "+f.nom},
        creer("img",{src:"/api/fichier/"+f.id, alt:f.nom, loading:"lazy"})));
    });
    article.appendChild(g);
  }
  if (docs.length){
    var dd = creer("div",{class:"docs"});
    docs.forEach(function(f){
      /* PDF : s'ouvre dans un nouvel onglet (le lecteur permet de le télécharger). */
      dd.appendChild(creer("a",{class:"doc", href:"/api/fichier/"+f.id,
        target:"_blank", rel:"noopener"},
        [ icone("ic-doc"), f.nom ]));
    });
    article.appendChild(dd);
  }
}


/* ============================================================================
   MOTEUR DE RENDU PAR BLOCS
   Chaque page = tableau « blocks ». On interprète le champ « type ».
   Ajouter un type de bloc = ajouter un case ci-dessous : le site reste extensible.
   ============================================================================ */
function rendreBloc(b){
  switch(b.type){

    case "hero":              return blocHero(b);
    case "cards":             return blocCards(b);
    case "can":               return blocCan(b);
    case "mot-consul":        return blocMotConsul(b);
    case "news-apercu":       return blocNewsApercu(b);
    case "note":              return blocNote(b);
    case "rich":              return blocRich(b);
    case "accordion":         return blocAccordion(b);
    case "facts":             return blocFacts(b);
    case "downloads":         return blocDownloads(b);
    case "steps":             return blocSteps(b);
    case "contactcard":       return blocContactCard(b);
    case "news-filtre":       return blocNewsFiltre(b);
    case "map":               return blocMap(b);
    case "contact-form":      return blocContactForm(b);
    case "rdv":               return blocRdv(b);

    default:
      return creer("div",{class:"wrap"},
        creer("p",{html:baliser("[À VALIDER PAR LE CONSULAT : bloc de type « "+b.type+" » à venir]")}));
  }
}

/* Drapeau : indique si le titre de niveau 1 (h1) a déjà été émis pour la page
   en cours. Réinitialisé au début de chaque rendu de page. Garantit un h1 unique
   par page (le premier titre), les suivants restant en h2 — hiérarchie WCAG. */
var pageH1Emis = false;

/* En-tête de section réutilisable : titre + filet tricolore court + intro.
   Le tout premier titre de la page est promu en h1 ; les autres sont en h2. */
function enteteSection(titre, rule, intro){
  var frag = document.createDocumentFragment();
  if (titre){
    var niveau = pageH1Emis ? "h2" : "h1";
    pageH1Emis = true;
    frag.appendChild(creer(niveau,{class:"section__titre"}, titre));
  }
  if (rule)  frag.appendChild(creer("hr",{class:"tricolore tricolore--court"}));
  if (intro) frag.appendChild(creer("p",{class:"section__intro", html:baliser(intro)}));
  return frag;
}

/* --- Bloc HERO --- */
function blocHero(b){
  var section = creer("section",{class:"hero"});
  var grille  = creer("div",{class:"grille"});

  var col = creer("div");
  if (b.eyebrow) col.appendChild(creer("p",{class:"etiquette", text:b.eyebrow}));
  col.appendChild(creer("h1",{html:baliser(b.title)}));
  pageH1Emis = true; /* le hero fournit le h1 unique de la page d'accueil */
  if (b.lead) col.appendChild(creer("p",{class:"lead", html:baliser(b.lead)}));
  if (b.actions){
    var actions = creer("div",{class:"actions"});
    b.actions.forEach(function(a){
      actions.appendChild(creer("a",{class:"btn btn--"+(a.style||"primaire"), href:a.href}, a.t));
    });
    col.appendChild(actions);
  }

  /* Photographie officielle : la vraie photo si elle a été téléversée dans
     l'admin, sinon l'emplacement réservé. */
  var media;
  var hid = PARAMS.hero_photo_id;
  if (hid && !modeDemo()){
    media = creer("div",{class:"hero-photo"},
      creer("img",{class:"hero-img", src:"/api/fichier/"+hid,
        alt:"Photographie officielle du consulat honoraire de Guinée-Bissau en Suisse"}));
  } else {
    media = creer("div",{class:"imgslot", role:"img",
      "aria-label":"Emplacement réservé à une photographie officielle"},
      creer("span",{}, [creer("strong",{text:"Photographie officielle"}),
                        creer("small",{text:b.img})]));
  }

  grille.appendChild(col);
  grille.appendChild(media);
  section.appendChild(creer("div",{class:"wrap"}, grille));
  return section;
}

/* --- Bloc CARDS (grille de cartes 2/3/4 colonnes) --- */

/* --- Bloc CAN (comparatif faisons / ne faisons pas) --- */

/* --- Bloc NEWS-APERCU (3 dernières actualités depuis D.news) --- */
function blocNewsApercu(b){
  var d = dico();
  var section = creer("section",{class:"section section--teinte"});
  var wrap = creer("div",{class:"wrap"});
  wrap.appendChild(enteteSection(b.title, b.rule, null));

  var grille = creer("div",{class:"actus"});
  var limite = b.limit || 3;

  function remplir(source){
    grille.innerHTML = "";
    source.slice(0, limite).forEach(function(n){
      var art = creer("article",{class:"actu"},[
        creer("div",{class:"meta"},[
          creer("span",{class:"etiquette", text:n.cat}),
          creer("time",{datetime:n.d, text:dateLisible(n.d)})
        ]),
        creer("h3",{html:baliser(n.t)}),
        creer("p",{html:baliser(n.x)})
      ]);
      ajouterPiecesJointes(art, n);
      grille.appendChild(art);
    });
  }
  remplir(d.news || []);
  wrap.appendChild(grille);

  /* Remplace par les publications réelles si disponibles. */
  chargerPublications().then(function(pubs){ if (pubs && pubs.length) remplir(pubs); });

  if (b.lien){
    wrap.appendChild(creer("p",{style:"margin-top:1.4em"},
      creer("a",{class:"btn btn--ligne", href:b.lien.href},[ b.lien.t+" ", icone("ic-fleche") ])));
  }
  section.appendChild(wrap);
  return section;
}

/* --- Bloc RICH (titre + paragraphes + liste à puces ; portrait optionnel) --- */
function blocRich(b){
  var section = creer("section",{class:"section" + (b.variant==="teinte"?" section--teinte":"")});
  var wrap = creer("div",{class:"wrap"});
  wrap.appendChild(enteteSection(b.title, b.rule, null));

  /* Corps textuel. */
  var corps = creer("div",{class:"rich"});
  if (b.lead) corps.appendChild(creer("p",{class:"lead", html:baliser(b.lead)}));
  (b.paras||[]).forEach(function(p){ corps.appendChild(creer("p",{html:baliser(p)})); });
  if (b.list){
    var ul = creer("ul",{class:"puces"});
    b.list.forEach(function(t){
      ul.appendChild(creer("li",{},[ icone("ic-check"), creer("span",{html:baliser(t)}) ]));
    });
    corps.appendChild(ul);
  }

  /* Si une image est fournie (ex. portrait du Consul), mise en page à deux colonnes. */
  if (b.img){
    var grille = creer("div",{class:"rich rich--media"});
    corps.classList.remove("rich");
    grille.appendChild(corps);
    /* Vraie photo si un paramètre la fournit (ex. consul_portrait_id), sinon
       l'emplacement réservé. */
    var pidR = b.photoParam ? PARAMS[b.photoParam] : null;
    if (pidR && !modeDemo()){
      grille.appendChild(creer("div",{class:"portrait"},
        creer("img",{class:"portrait-img", src:"/api/fichier/"+pidR, alt:b.img})));
    } else {

                         creer("small",{text:b.img})])));

    wrap.appendChild(grille);
  } else {
    wrap.appendChild(corps);
  }
  section.appendChild(wrap);
  return section;
}

/* --- Bloc ACCORDION (FAQ dépliable, accessible clavier) --- */
function blocAccordion(b){
  var section = creer("section",{class:"section" + (b.variant==="teinte"?" section--teinte":"")});
  var wrap = creer("div",{class:"wrap"});
  wrap.appendChild(enteteSection(b.title, b.rule, b.intro));

  var acc = creer("div",{class:"accordion"});
  b.items.forEach(function(it, i){
    var idPanneau = "acc-"+(b.key||"faq")+"-"+i;
    var tete = creer("button",{class:"accordion__tete", type:"button",
      "aria-expanded":"false", "aria-controls":idPanneau},
      [ creer("span",{html:baliser(it.q)}), icone("ic-chevron") ]);
    var corps = creer("div",{class:"accordion__corps", id:idPanneau, hidden:"hidden"},
      creer("div",{}, reponseAccordion(it)));
    acc.appendChild(creer("div",{class:"accordion__item"},[tete, corps]));
  });

  /* Ouverture/fermeture par délégation d'événement (aucun setTimeout). */
  acc.addEventListener("click", function(e){
    var t = e.target.closest(".accordion__tete");
    if (!t) return;
    var ouvert = t.getAttribute("aria-expanded") === "true";
    t.setAttribute("aria-expanded", ouvert ? "false" : "true");
    document.getElementById(t.getAttribute("aria-controls")).hidden = ouvert;
  });

  wrap.appendChild(acc);
  section.appendChild(wrap);
  return section;
}
/* Corps d'une réponse de FAQ : paragraphe(s) + éventuelle redirection stylée. */
function reponseAccordion(it){
  var frag = document.createDocumentFragment();
  var reps = Array.isArray(it.a) ? it.a : [it.a];
  reps.forEach(function(p){ frag.appendChild(creer("p",{html:baliser(p)})); });
  if (it.redirection){
    frag.appendChild(creer("div",{class:"note note--info"},[
      icone("ic-fleche"),
      creer("div",{}, creer("p",{html:baliser("À adresser à : "+it.redirection)}))
    ]));
  }
  return frag;
}

/* --- Bloc DOWNLOADS (documents PDF téléchargeables) --- */
function blocDownloads(b){
  var section = creer("section",{class:"section"});
  var wrap = creer("div",{class:"wrap"});
  wrap.appendChild(enteteSection(b.title, b.rule, b.intro));

  var liste = creer("ul",{class:"downloads"});
  wrap.appendChild(liste);

  /* Rendu d'un document réel (téléversé par le consulat), cliquable. */
  function rendreReel(doc){
    var estImage = /^image\//.test(doc.type_mime || "");
    return creer("a",{class:"telechargement", href:"/api/document/"+doc.id, target:"_blank", rel:"noopener"},[
      icone("ic-doc","ic--lg"),
      creer("span",{class:"infos"},[
        creer("strong",{html:baliser(doc.titre)}),
        creer("small",{text:doc.nom})
      ]),
      creer("span",{class:"format", text: estImage ? "IMAGE" : "PDF"})
    ]);
  }
  /* Rendu d'un élément statique de repli (avant tout téléversement). */
  function rendreStatique(doc){
    var dispo = !!doc.href;
    var attrs = {class:"telechargement"};
    if (dispo){ attrs.href = doc.href; attrs.target = "_blank"; attrs.rel = "noopener"; }
    else { attrs["aria-disabled"] = "true"; attrs.role = "note"; }
    return creer(dispo ? "a" : "div", attrs, [
      icone("ic-doc","ic--lg"),
      creer("span",{class:"infos"},[
        creer("strong",{html:baliser(doc.t)}),
        creer("small",{html:baliser(dispo ? (doc.desc||"") :
          "[À VALIDER PAR LE CONSULAT : fichier PDF à fournir]")})
      ]),
      creer("span",{class:"format", text: doc.format || "PDF"})
    ]);
  }
  function peupler(source, reel){
    liste.innerHTML = "";
    source.forEach(function(doc){
      liste.appendChild(creer("li",{}, reel ? rendreReel(doc) : rendreStatique(doc)));
    });
  }

  /* Éléments statiques par défaut, puis remplacés par les documents réels. */
  peupler(b.items || [], false);
  chargerDocuments().then(function(docs){ if (docs && docs.length) peupler(docs, true); });

  section.appendChild(wrap);
  return section;
}

/* --- Bloc NEWS-FILTRE (liste d'actualités filtrable par rubrique) --- */
function blocNewsFiltre(b){
  var d = dico();
  var section = creer("section",{class:"section"});
  var wrap = creer("div",{class:"wrap"});
  wrap.appendChild(enteteSection(b.title, b.rule, b.intro));

  /* Données affichées : d'abord les actualités statiques du dictionnaire, puis
     remplacées par les publications du serveur si elles existent (voir plus bas). */
  var donnees = (d.news || []).slice();
  var catActive = "*";

  var barre = creer("div",{class:"filtres", role:"group", "aria-label":b.filtresLabel||"Filtrer par rubrique"});
  wrap.appendChild(barre);
  var grille = creer("div",{class:"actus", id:"listeActus"});
  wrap.appendChild(grille);

  /* (Re)construit la barre de filtres à partir des rubriques présentes. */
  function construireFiltres(){
    var rubriques = [];
    donnees.forEach(function(n){ if (rubriques.indexOf(n.cat) === -1) rubriques.push(n.cat); });
    if (rubriques.indexOf(catActive) === -1) catActive = "*";
    barre.innerHTML = "";
    [{cat:"*", t:b.toutes||"Toutes"}].concat(rubriques.map(function(c){ return {cat:c, t:c}; }))
      .forEach(function(o){
        barre.appendChild(creer("button",{type:"button", "data-cat":o.cat,
          "aria-pressed": o.cat===catActive ? "true" : "false"}, o.t));
      });
  }

  /* Remplit la grille selon la rubrique active, avec pièces jointes éventuelles. */
  function peupler(){
    grille.innerHTML = "";
    var liste = donnees.filter(function(n){ return catActive==="*" || n.cat===catActive; });
    if (!liste.length){
      grille.appendChild(creer("p",{class:"actus-vide", text:b.vide||"Aucune actualité dans cette rubrique."}));
      return;
    }
    liste.forEach(function(n){
      var art = creer("article",{class:"actu" + (n.r?" actu--une":"")},[
        n.r ? creer("span",{class:"aune", text:b.aune||"À la une"}) : null,
        creer("div",{class:"meta"},[
          creer("span",{class:"etiquette", text:n.cat}),
          creer("time",{datetime:n.d, text:dateLisible(n.d)})
        ]),
        creer("h3",{html:baliser(n.t)}),
        creer("p",{html:baliser(n.x)})
      ]);
      ajouterPiecesJointes(art, n);
      grille.appendChild(art);
    });
  }

  construireFiltres();
  peupler();

  /* Interaction : changement de rubrique. */
  barre.addEventListener("click", function(e){
    var bt = e.target.closest("button[data-cat]");
    if (!bt) return;
    var btns = barre.querySelectorAll("button");
    for (var i=0;i<btns.length;i++) btns[i].setAttribute("aria-pressed","false");
    bt.setAttribute("aria-pressed","true");
    catActive = bt.getAttribute("data-cat");
    peupler();
  });

  /* Chargement des publications réelles (si en ligne) : elles remplacent alors
     les actualités statiques. */
  chargerPublications().then(function(pubs){
    if (pubs && pubs.length){ donnees = pubs; construireFiltres(); peupler(); }
  });

  section.appendChild(wrap);
  return section;
}

/* --- Bloc CONTACT-FORM (formulaire de contact) --- */
function blocContactForm(b){
  var section = creer("section",{class:"section"});
  var wrap = creer("div",{class:"wrap"});
  wrap.appendChild(enteteSection(b.title, b.rule, b.intro));

  var f = b.form || {};
  var form = creer("form",{class:"form", novalidate:"novalidate"});

  /* Zone de confirmation accessible (annonce vocale via aria-live). */
  var conf = creer("div",{class:"form__confirmation", role:"status", "aria-live":"polite",
    hidden:"hidden", tabindex:"-1"});

  /* Champ honeypot anti-robot : masqué visuellement, ignoré des humains. */
  var pot = creer("div",{class:"pot", "aria-hidden":"true"},[
    creer("label",{for:"cf-site"}, "Ne pas remplir"),
    creer("input",{type:"text", id:"cf-site", name:"site", tabindex:"-1", autocomplete:"off"})
  ]);

  /* Construction des champs à partir de la description du dictionnaire. */
  function champ(c){
    var id = "cf-"+c.name;
    var etiquette = creer("label",{for:id}, [ c.label, c.requis ? creer("span",{class:"requis"}, " *") : null ]);
    var ctrl;
    if (c.type === "textarea"){
      ctrl = creer("textarea",{id:id, name:c.name});
    } else if (c.type === "select"){
      ctrl = creer("select",{id:id, name:c.name});
      (c.options||[]).forEach(function(o){ ctrl.appendChild(creer("option",{value:o}, o)); });
    } else {
      ctrl = creer("input",{type:c.type||"text", id:id, name:c.name});
    }
    if (c.requis) ctrl.setAttribute("required","required");
    if (c.autocomplete) ctrl.setAttribute("autocomplete", c.autocomplete);
    var bloc = creer("div",{class:"champ"},[ etiquette, ctrl,
      c.aide ? creer("p",{class:"aide", html:baliser(c.aide)}) : null ]);
    return bloc;
  }
  (f.champs||[]).forEach(function(c){ form.appendChild(champ(c)); });

  /* Case de consentement (finalité et base légale du traitement). */
  if (f.consentement){
    form.appendChild(creer("div",{class:"champ consentement"},[
      creer("input",{type:"checkbox", id:"cf-consent", name:"consentement", required:"required"}),
      creer("label",{for:"cf-consent", style:"font-weight:400"}, f.consentement)
    ]));
  }

  form.appendChild(pot);
  var bouton = creer("button",{type:"submit", class:"btn btn--primaire"}, f.envoyer||"Envoyer");
  form.appendChild(bouton);
  form.appendChild(conf);

  /* Soumission : validation native + honeypot + confirmation + désactivation. */
  form.addEventListener("submit", function(e){
    e.preventDefault();
    /* Robot détecté (honeypot rempli) : on simule un succès sans rien envoyer. */
    if (form.site && form.site.value){ return; }
    if (!form.checkValidity()){ form.reportValidity(); return; }

    /* Données transmises au backend (endpoint /api/contact du même domaine). */
    var donnees = {
      nom: form.nom.value, courriel: form.courriel.value,
      objet: form.objet ? form.objet.value : "", message: form.message.value,
      consentement: form["consentement"] ? form["consentement"].checked : false,
      site: form.site ? form.site.value : ""
    };

    var afficherSucces = function(){
      conf.className = "form__confirmation"; conf.innerHTML = "";
      conf.appendChild(icone("ic-check","ic--lg"));
      conf.appendChild(creer("div",{}, creer("p",{html:baliser(f.confirmation||
        "Votre message a été pris en compte. Nous vous répondrons dans les meilleurs délais.")})));
      conf.hidden = false;
      bouton.disabled = true;
      bouton.textContent = f.envoye || "Message envoyé";
      conf.focus();
    };
    var afficherErreur = function(){
      conf.className = "form__confirmation form__erreur"; conf.innerHTML = "";
      conf.appendChild(icone("ic-alerte","ic--lg"));
      conf.appendChild(creer("div",{}, creer("p",{html:baliser(f.erreur||
        "L’envoi a échoué. Merci de réessayer plus tard ou de nous contacter par téléphone.")})));
      conf.hidden = false;
      bouton.disabled = false;
      conf.focus();
    };

    /* Mode démonstration (fichier local) : pas d'appel réseau. */
    if (modeDemo()){ afficherSucces(); return; }

    /* Sinon : envoi réel au backend. */
    bouton.disabled = true;
    posterJSON("/api/contact", donnees)
      .then(function(rep){ if (rep && rep.ok) afficherSucces(); else afficherErreur(); })
      .catch(afficherErreur);
  });

  wrap.appendChild(form);
  section.appendChild(wrap);
  return section;
}

/* --- Bloc RDV (demande de rendez-vous : motif + jour + créneau + coordonnées).
   Tous les libellés proviennent des données (b) : traduisible. La sélection et
   la confirmation sont gérées par délégation d'événement, sans stockage. --- */
function blocRdv(b){
  var section = creer("section",{class:"section"});
  var wrap = creer("div",{class:"wrap"});
  wrap.appendChild(enteteSection(b.title, b.rule, b.intro));

  /* État local à ce rendu (réinitialisé à chaque changement de page/langue). */
  var etat = { jour:null, jourTexte:null, heure:null };

  var grille = creer("div",{class:"bloc-rdv"});
  var form = creer("form",{class:"rdv-form", novalidate:"novalidate"});

  /* Motif (liste déroulante). */
  var selMotif = creer("select",{id:"rdv-motif", name:"motif", required:"required"});
  selMotif.appendChild(creer("option",{value:""}, b.motifDefaut || "—"));
  (b.motifOptions||[]).forEach(function(o){ selMotif.appendChild(creer("option",{}, o)); });
  form.appendChild(creer("div",{class:"champ"},[
    creer("label",{class:"etq", for:"rdv-motif"},[ b.motifLabel, creer("span",{class:"req"}," *") ]),
    selMotif,
    b.motifAide ? creer("p",{class:"aide", html:baliser(b.motifAide)}) : null
  ]));

  /* Jour souhaité (puces générées : prochains jours ouvrés). */
  var grpJours = creer("div",{class:"puces", id:"rdv-jours", role:"group", "aria-labelledby":"rdv-lbl-jour"});
  form.appendChild(creer("div",{class:"champ"},[
    creer("div",{class:"legende-champ"},[
      creer("label",{class:"etq", id:"rdv-lbl-jour"},[ b.jourLabel, creer("span",{class:"req"}," *") ]),
      b.jourIndic ? creer("span",{class:"indic", html:baliser(b.jourIndic)}) : null
    ]),
    grpJours
  ]));

  /* Créneau horaire (apparaît après le choix d'un jour). */
  var grpHeures = creer("div",{class:"puces", id:"rdv-heures", role:"group", "aria-labelledby":"rdv-lbl-heure"});
  var blocHeures = creer("div",{class:"champ creneaux", hidden:"hidden"},[
    creer("label",{class:"etq", id:"rdv-lbl-heure"},[ b.heureLabel, creer("span",{class:"req"}," *") ]),
    grpHeures
  ]);
  form.appendChild(blocHeures);

  /* Récapitulatif du créneau choisi. */
  var recap = creer("p",{class:"rdv-recap", hidden:"hidden"});
  form.appendChild(recap);

  /* Coordonnées et précisions (champs pilotés par les données). */
  (b.champs||[]).forEach(function(c){
    var id = "rdv-"+c.name, ctrl;
    if (c.type === "textarea") ctrl = creer("textarea",{id:id, name:c.name});
    else ctrl = creer("input",{type:c.type||"text", id:id, name:c.name});
    if (c.requis) ctrl.setAttribute("required","required");
    if (c.autocomplete) ctrl.setAttribute("autocomplete", c.autocomplete);
    form.appendChild(creer("div",{class:"champ"},[
      creer("label",{class:"etq", for:id},[ c.label, c.requis ? creer("span",{class:"req"}," *") : null ]),
      ctrl,
      c.aide ? creer("p",{class:"aide", html:baliser(c.aide)}) : null
    ]));
  });

  /* Consentement. */
  form.appendChild(creer("div",{class:"champ consent"},[
    creer("input",{type:"checkbox", id:"rdv-consent", name:"consent", required:"required"}),
    creer("label",{for:"rdv-consent", style:"font-family:var(--texte);font-weight:400;color:var(--encre)",
      html:baliser(b.consentement)})
  ]));

  /* Honeypot anti-robot. */
  form.appendChild(creer("div",{class:"pot", "aria-hidden":"true"},[
    creer("label",{for:"rdv-site"},"Ne pas remplir"),
    creer("input",{type:"text", id:"rdv-site", name:"site", tabindex:"-1", autocomplete:"off"})
  ]));

  var bouton = creer("button",{type:"submit", class:"btn btn--primaire"}, b.envoyer || "Envoyer");
  form.appendChild(bouton);
  var conf = creer("div",{class:"rdv-confirmation", role:"status", "aria-live":"polite", hidden:"hidden", tabindex:"-1"});
  form.appendChild(conf);

  /* --- Génération des jours ouvrés (à partir d'aujourd'hui, week-ends exclus). */
  var jn = JOURS_SEM[Etat.langue] || JOURS_SEM.fr;
  var ma = MOIS_ABBR[Etat.langue] || MOIS_ABBR.fr;
  function pad(n){ return (n<10?"0":"")+n; }
  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
  var base = new Date(), ajoutes = 0, k = 0;
  while (ajoutes < 6 && k < 20){
    k++;
    var j = new Date(base.getTime() + k*86400000);
    var jj = j.getDay();
    if (jj === 0 || jj === 6) continue;
    var texte = cap(jn[jj]) + " " + j.getDate() + " " + ma[j.getMonth()];
    var puce = creer("button",{type:"button", class:"puce", "aria-pressed":"false",
      "data-iso": j.getFullYear()+"-"+pad(j.getMonth()+1)+"-"+pad(j.getDate()),
      "data-texte": texte});
    puce.innerHTML = cap(jn[jj]) + "<small>" + j.getDate() + " " + ma[j.getMonth()] + "</small>";
    grpJours.appendChild(puce);
    ajoutes++;
  }

  function construireHeures(){
    grpHeures.innerHTML = "";
    (b.heures || ["09:00","10:00","11:00","14:00","15:00","16:00"]).forEach(function(h){
      var p = creer("button",{type:"button", class:"puce", "aria-pressed":"false", "data-heure":h}, h);
      grpHeures.appendChild(p);
    });
