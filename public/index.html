  function marquer(groupe, choisi){
    var ps = groupe.querySelectorAll(".puce");
    for (var i=0;i<ps.length;i++) ps[i].setAttribute("aria-pressed","false");
    choisi.setAttribute("aria-pressed","true");
  }
  function majRecap(){
    if (etat.jourTexte && etat.heure){
      recap.innerHTML = baliser((b.recapModele || "Créneau souhaité : <strong>{jour} à {heure}</strong>.")
        .replace("{jour}", etat.jourTexte).replace("{heure}", etat.heure));
      recap.hidden = false;
    } else recap.hidden = true;
  }

  grpJours.addEventListener("click", function(e){
    var p = e.target.closest(".puce"); if (!p) return;
    marquer(this, p);
    etat.jour = p.getAttribute("data-iso");
    etat.jourTexte = p.getAttribute("data-texte");
    etat.heure = null;
    construireHeures();
    blocHeures.hidden = false;
    majRecap();
  });
  grpHeures.addEventListener("click", function(e){
    var p = e.target.closest(".puce"); if (!p) return;
    marquer(this, p);
    etat.heure = p.getAttribute("data-heure");
    majRecap();
  });

  form.addEventListener("submit", function(e){
    e.preventDefault();
    if (form.site.value) return;                       /* robot : on ignore */
    if (!etat.jour || !etat.heure){
      recap.innerHTML = baliser(b.alerteChoix || "Merci de choisir un jour et un créneau.");
      recap.hidden = false; recap.style.color = "var(--rouge)";
      return;
    }
    if (!form.checkValidity()){ form.reportValidity(); return; }

    /* Données transmises au backend (endpoint /api/rendezvous du même domaine). */
    var donnees = {
      motif: form.motif ? form.motif.value : "",
      jour: etat.jour, heure: etat.heure,
      nom: form.nom.value, courriel: form.courriel.value,
      tel: form.tel ? form.tel.value : "",
      message: form.message ? form.message.value : "",
      consent: form.consent ? form.consent.checked : false,
      site: form.site ? form.site.value : ""
    };

    var afficherSucces = function(){
      conf.className = "rdv-confirmation"; conf.innerHTML = "";
      conf.appendChild(icone("ic-check","ic--lg"));
      var texte = (b.confModele || "Demande enregistrée pour {jour} à {heure}.")
        .replace("{jour}", etat.jourTexte).replace("{heure}", etat.heure);
      conf.appendChild(creer("div",{},[
        creer("p",{style:"margin:0", html:"<strong>"+baliser(b.confTitre||"Demande envoyée")+"</strong>"}),
        creer("p",{style:"margin:.3em 0 0", html:baliser(texte)})
      ]));
      conf.hidden = false;
      bouton.disabled = true;
      bouton.textContent = b.envoye || "Demande envoyée";
      conf.focus();
    };
    var afficherErreur = function(){
      conf.className = "rdv-confirmation rdv-erreur"; conf.innerHTML = "";
      conf.appendChild(icone("ic-alerte","ic--lg"));
      conf.appendChild(creer("div",{}, creer("p",{style:"margin:0", html:baliser(b.erreur||
        "L’envoi a échoué. Merci de réessayer plus tard ou de nous contacter par téléphone.")})));
      conf.hidden = false;
      bouton.disabled = false;
      conf.focus();
    };

    if (modeDemo()){ afficherSucces(); return; }

    bouton.disabled = true;
    posterJSON("/api/rendezvous", donnees)
      .then(function(rep){ if (rep && rep.ok) afficherSucces(); else afficherErreur(); })
      .catch(afficherErreur);
  });

  /* Panneau latéral (informations pratiques). */
  var aside = creer("aside",{class:"rdv-aside"});
  var a = b.aside || {};
  if (a.horairesTitre){
    var dl = creer("dl");
    (a.horairesLignes||[]).forEach(function(l){
      dl.appendChild(creer("dt",{html:baliser(l.k)}));
      dl.appendChild(creer("dd",{html:baliser(l.v)}));
    });
    aside.appendChild(creer("div",{class:"carte-rdv"},[
      creer("h3",{},[ icone("ic-horloge"), creer("span",{html:baliser(a.horairesTitre)}) ]),
      creer("hr",{class:"tricolore tricolore--court"}),
      dl,
      a.horairesLien ? creer("p",{style:"margin:0"}, creer("a",{href:a.horairesLien.href}, a.horairesLien.t)) : null
    ]));
  }
  if (a.apporterTitre){
    aside.appendChild(creer("div",{class:"carte-rdv"},[
      creer("h3",{},[ icone("ic-doc"), creer("span",{html:baliser(a.apporterTitre)}) ]),
      creer("hr",{class:"tricolore tricolore--court"}),
      creer("p",{style:"margin:0;font-size:.92rem", html:baliser(a.apporterTexte)})
    ]));
  }
  if (a.securite){
    aside.appendChild(creer("div",{class:"rdv-attention", html:baliser("<strong>"+(a.securiteTitre||"Sécurité :")+"</strong> "+a.securite)}));
  }

  grille.appendChild(form);
  grille.appendChild(aside);
  wrap.appendChild(grille);
  section.appendChild(wrap);
  return section;
}


/* ============================================================================
   ROUTEUR PAR HASH (#/accueil, #/services, …)
   Réinjecte la page dans <main>, remonte en haut, met à jour document.title,
   la meta description et l'attribut aria-current de la navigation.
   ============================================================================ */
function pageParHash(){
  var h = location.hash.replace(/^#\/?/, "");   // "accueil", "services"…
  return h || "accueil";
}

function rendrePage(){
  var d = dico();
  var id = pageParHash();
  Etat.route = id;
  pageH1Emis = false; /* réinitialise le suivi du titre h1 unique de la page */

  var page = (d.pages || {})[id];
  var main = document.getElementById("contenu");
  main.innerHTML = "";

  if (!page){
    /* Page non encore disponible (sera ajoutée aux étapes 2-3). */
    var av = creer("section",{class:"section"},
      creer("div",{class:"wrap"},[
        creer("h1",{text:"Page en préparation"}),
        creer("hr",{class:"tricolore tricolore--court"}),
        creer("p",{html:baliser("Cette page sera publiée prochainement. [À VALIDER PAR LE CONSULAT : contenu de la page « "+id+" »]")}),
        creer("p",{}, creer("a",{class:"btn btn--primaire", href:"#/accueil"},"Retour à l’accueil"))
      ]));
    main.appendChild(av);
    document.title = "Page en préparation — " + d.ui.marqueTitre;
  } else {
    /* Rendu de chaque bloc de la page. */
    page.blocks.forEach(function(b){ main.appendChild(rendreBloc(b)); });

    /* SEO : titre et description par page. */
    document.title = page.title || d.ui.marqueTitre;
    var meta = document.querySelector('meta[name="description"]');
    if (meta && page.desc) meta.setAttribute("content", page.desc);
  }

  majSeo(id, page, d);
  majNavActive(id);
  activerReveal();

  /* Accessibilité : on remonte en haut et on déplace le focus sur le contenu.
     (Sauté lors d'un simple rafraîchissement, ex. après chargement des paramètres.) */
  if (!SUPPRIMER_DEFILEMENT){ window.scrollTo(0,0); main.focus(); }
}

/* Rafraîchit la page courante sans remonter en haut ni déplacer le focus. */
var SUPPRIMER_DEFILEMENT = false;
function rendrePageSansDefilement(){
  SUPPRIMER_DEFILEMENT = true;
  try { rendrePage(); } finally { SUPPRIMER_DEFILEMENT = false; }
}

/* Met à jour aria-current="page" sur l'entrée de navigation active. */
function majNavActive(id){
  var liens = document.querySelectorAll("#navPrincipale a, #piedNav a");
  for (var i=0;i<liens.length;i++){
    var cible = liens[i].getAttribute("href").replace(/^#\/?/, "");
    if (cible === id) liens[i].setAttribute("aria-current","page");
    else liens[i].removeAttribute("aria-current");
  }
}

/* Configuration SEO. IMPORTANT : remplacer SITE.base par le domaine officiel. */
var SITE = { base: "https://www.consulat-guineebissau.ch/" };
var OG_LOCALE = { fr: "fr_CH", pt: "pt_PT", en: "en_GB" };

/* Met à jour le lien canonique et les balises Open Graph selon la page/langue.
   L'URL canonique reflète la langue (?lang=) et la page (#/id) courantes. */
function majSeo(id, page, d){
  var lang = Etat.langue;
  var url = SITE.base + "?lang=" + lang + "#/" + id;
  var titre = page ? (page.title || d.ui.marqueTitre) : d.ui.marqueTitre;
  var desc  = (page && page.desc) ? page.desc : d.ui.alerteCompetence;

  function set(idEl, attr, val){
    var el = document.getElementById(idEl);
    if (el) el.setAttribute(attr, val);
  }
  set("lienCanonique", "href", url);
  set("ogUrl", "content", url);
  set("ogTitre", "content", titre);
  set("ogDesc", "content", desc);
  set("ogLocale", "content", OG_LOCALE[lang] || "fr_CH");
}

/* Lit une langue valide depuis le paramètre ?lang= de l'URL (sinon null). */
function langueDepuisUrl(){
  var m = location.search.match(/[?&]lang=(fr|pt|en)\b/);
  return m ? m[1] : null;
}

/* Écrit la langue active dans l'URL (?lang=) sans recharger ni stocker.
   Permet des URL partageables et des balises hreflang réellement valides. */
function ecrireLangueUrl(code){
  if (!history.replaceState) return;
  var search = location.search.replace(/([?&])lang=(fr|pt|en)\b/,"$1lang="+code);
  if (search.indexOf("lang=") === -1){
    search = (search ? search + "&" : "?") + "lang=" + code;
  }
  history.replaceState(null, "", location.pathname + search + location.hash);
}


/* ============================================================================
   CONSTRUCTION DES GABARITS FIXES (en-tête, alerte, pied)
   ============================================================================ */
function rendreChrome(){
  var d = dico();

  /* Attribut lang du document. */
  document.documentElement.setAttribute("lang", d.code);

  /* Bandeau d'État + marque. */
  txt("etat-gauche", d.ui.etatGauche);
  txt("perm-label", d.ui.permLabel);

  /* Permanence téléphonique : numéro issu des paramètres (repli = marqueur). */
  var permNum = document.getElementById("permNum");
  var permLien = document.getElementById("permanenceTel");
  if (permNum && permLien){
    var val = injecter("{par:telephone}");
    permNum.innerHTML = baliser("{par:telephone}");
    var chiffres = val.replace(/[^+0-9]/g, "");
    /* Lien cliquable seulement si un vrai numéro est renseigné. */
    if (chiffres.replace(/\D/g,"").length >= 6){ permLien.setAttribute("href", "tel:" + chiffres); }
    else { permLien.removeAttribute("href"); }
  }
  txt("marque-titre", d.ui.marqueTitre);
  txt("marque-sous", d.ui.marqueSous);


  /* Navigation principale. */
  var nav = document.getElementById("navPrincipale");
  nav.setAttribute("aria-label", d.ui.aria.naviguer);
  nav.innerHTML = "";
  /* Bouton « fermer » en tête du menu mobile (masqué en navigation bureau). */
  nav.appendChild(creer("button",{type:"button", class:"nav-fermer",
    "aria-label": (d.ui.aria && d.ui.aria.fermerMenu) || "Fermer le menu"},
    [ icone("ic-fermer","ic--lg") ]));
  d.nav.forEach(function(item){
    /* L'entrée « rendezvous » est mise en avant comme un bouton d'action. */
    var attrs = {href:"#/"+item.id};
    if (item.id === "rendezvous") attrs.class = "nav-cta";
    nav.appendChild(creer("a", attrs, item.t));
  });

  /* Sélecteur de langue (liste des langues disponibles). */
  var liste = document.getElementById("listeLangues");
  liste.innerHTML = "";
  ["fr","pt","en"].forEach(function(code){
    var nom = (D[code] && D[code].ui && D[code].ui.langNom) || code.toUpperCase();
    var b = creer("button",{role:"menuitem", type:"button", "data-lang":code}, nom);
    if (code === Etat.langue) b.setAttribute("aria-current","true");
    liste.appendChild(creer("li",{role:"none"}, b));
  });
  document.getElementById("langueCourante").textContent = Etat.langue.toUpperCase();

  /* Pied de page. */
  txt("pied-titre1", d.ui.piedTitre1);
  txt("pied-titre2", d.ui.piedTitre2);
  txt("pied-titre3", d.ui.piedTitre3);
  var adresse = document.querySelector('[data-ui="pied-adresse"]');
  if (adresse) adresse.innerHTML = baliser("{par:adresse}<br>{par:ville}<br>Tél. {par:telephone}<br>{par:courriel}");
  var ratt = document.querySelector('[data-ui="pied-rattachement"]');
  if (ratt) ratt.innerHTML = baliser(d.ui.piedRattachement);
  txt("pied-copyright", d.ui.piedCopyright);
  txt("pied-avis", d.ui.piedAvis);

  /* Lien discret vers l'espace d'administration (connexion réservée au consulat). */
  var lienAdmin = document.getElementById("lienAdmin");
  if (lienAdmin){
    lienAdmin.innerHTML = "";
    lienAdmin.appendChild(icone("ic-verrou"));
    lienAdmin.appendChild(document.createTextNode(" " + (d.ui.adminLien || "Administration")));
  }

  var piedNav = document.getElementById("piedNav");
  piedNav.innerHTML = "";
  d.nav.forEach(function(item){
    piedNav.appendChild(creer("li",{}, creer("a",{href:"#/"+item.id}, item.t)));
  });
  var piedLegal = document.getElementById("piedLegal");
  piedLegal.innerHTML = "";
  d.ui.legal.forEach(function(item){
    piedLegal.appendChild(creer("li",{}, creer("a",{href:"#/"+item.id}, item.t)));
  });

  /* Bandeau cookies. */
  var ck = d.ui.cookies;
  var ckTexte = document.querySelector('[data-ui="cookies-texte"]');
  if (ckTexte) ckTexte.innerHTML = baliser(ck.texte);
  document.getElementById("cookiesRefuser").textContent = ck.refuser;
  document.getElementById("cookiesAccepter").textContent = ck.accepter;
  document.getElementById("cookiesLien").textContent = ck.lien;
}

/* Raccourci : écrit du texte dans un élément repéré par data-ui. */
function txt(cle, valeur){
  var el = document.querySelector('[data-ui="'+cle+'"]');
  if (el) el.textContent = valeur;
}


/* ============================================================================
   INTERACTIONS (délégation d'événements — aucun setTimeout d'initialisation)
   ============================================================================ */

/* --- Sélecteur de langue --- */
function ouvrirLangue(ouvrir){
  var btn = document.getElementById("btnLangue");
  var liste = document.getElementById("listeLangues");
  btn.setAttribute("aria-expanded", ouvrir ? "true" : "false");
  liste.hidden = !ouvrir;
}

function changerLangue(code){
  if (!D[code]) return;
  Etat.langue = code;
  ecrireLangueUrl(code); // met à jour ?lang= (URL partageable, hreflang valides)
  rendreChrome();   // reconstruit en-tête / alerte / pied dans la nouvelle langue
  rendrePage();     // reconstruit la page courante
  ouvrirLangue(false);
  document.getElementById("btnLangue").focus();
}

/* --- Menu mobile --- */
function ouvrirMenu(ouvrir){
  var nav = document.getElementById("navPrincipale");
  var btn = document.getElementById("btnBurger");
  var voile = document.getElementById("voile");
  nav.classList.toggle("ouvert", ouvrir);
  btn.setAttribute("aria-expanded", ouvrir ? "true" : "false");
  voile.hidden = !ouvrir;
}

/* --- Animations d'apparition (IntersectionObserver, sinon affichage direct) --- */
function activerReveal(){
  var cibles = document.querySelectorAll("#contenu .section, #contenu .hero");
  var reduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduit || !("IntersectionObserver" in window)){
    for (var i=0;i<cibles.length;i++) cibles[i].classList.add("vu");
    return;
  }
  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting){ e.target.classList.add("vu"); obs.unobserve(e.target); }
    });
  }, {rootMargin:"0px 0px -8% 0px", threshold:0.06});
  for (var j=0;j<cibles.length;j++){
    cibles[j].classList.add("reveal");
    obs.observe(cibles[j]);
  }
}


/* ============================================================================
   AMORÇAGE DE L'APPLICATION
   ============================================================================ */
(function initialiser(){

  /* Langue initiale : paramètre ?lang= s'il est présent et valide, sinon FR. */
  var langUrl = langueDepuisUrl();
  if (langUrl) Etat.langue = langUrl;

  /* Construction initiale de l'ossature et de la première page. */
  rendreChrome();
  if (!location.hash) location.replace("#/accueil");
  rendrePage();

  /* Chargement des paramètres du consulat (coordonnées, horaires, bandeau) :
     on rafraîchit ensuite l'en-tête/pied, la page courante et le bandeau. */
  chargerParametres().then(function(){
    rendreChrome();
    rendrePageSansDefilement();
    afficherBandeau();
  });

  /* Bandeau cookies : affiché tant qu'il n'a pas été fermé dans la session. */
  var banniere = document.getElementById("cookiesBanniere");
  function fermerCookies(){ Etat.cookiesFerme = true; banniere.hidden = true; }
  if (!Etat.cookiesFerme) banniere.hidden = false;
  document.getElementById("cookiesAccepter").addEventListener("click", fermerCookies);
  document.getElementById("cookiesRefuser").addEventListener("click", fermerCookies);
  document.getElementById("cookiesLien").addEventListener("click", fermerCookies);

  /* Routage : réagit au changement de hash (et au bouton « précédent »). */
  window.addEventListener("hashchange", function(){
    ouvrirMenu(false);   // referme le menu mobile lors d'une navigation
    rendrePage();
  });

  /* Sélecteur de langue : ouverture/fermeture. */
  document.getElementById("btnLangue").addEventListener("click", function(e){
    e.stopPropagation();
    var ouvert = this.getAttribute("aria-expanded") === "true";
    ouvrirLangue(!ouvert);
  });
  /* Choix d'une langue (délégation sur la liste). */
  document.getElementById("listeLangues").addEventListener("click", function(e){
    var b = e.target.closest("button[data-lang]");
    if (b) changerLangue(b.getAttribute("data-lang"));
  });

  /* Menu mobile : ouverture. */
  document.getElementById("btnBurger").addEventListener("click", function(){
    var ouvert = this.getAttribute("aria-expanded") === "true";
    ouvrirMenu(!ouvert);
  });
  /* Fermeture du menu par le voile ou par un clic sur un lien de navigation. */
  document.getElementById("voile").addEventListener("click", function(){ ouvrirMenu(false); });
  document.getElementById("navPrincipale").addEventListener("click", function(e){
    /* Ferme le menu sur un lien de navigation ou sur le bouton « fermer ». */
    if (e.target.closest("a") || e.target.closest(".nav-fermer")) ouvrirMenu(false);
  });

  /* Fermetures globales : clic hors zone + touche Échap. */
  document.addEventListener("click", function(e){
    if (!e.target.closest(".langue")) ouvrirLangue(false);
  });
  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    /* Ferme d'abord le sélecteur de langue s'il est ouvert, en rendant le focus. */
    var btnLangue = document.getElementById("btnLangue");
    if (btnLangue.getAttribute("aria-expanded") === "true"){
      ouvrirLangue(false); btnLangue.focus(); return;
    }
    /* Sinon ferme le menu mobile s'il est ouvert, en rendant le focus au burger. */
    var btnBurger = document.getElementById("btnBurger");
    if (btnBurger.getAttribute("aria-expanded") === "true"){
      ouvrirMenu(false); btnBurger.focus();
    }
  });

})();
</script>
